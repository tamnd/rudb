[package]
name = "xtask"
description = "Build, check and benchmark tasks for the rudb workspace."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Every dependency here is a crate one of the measuring tasks has to link, because a task that
# measures the engine cannot do it without the engine in the process. `bench` cannot time a parser
# it cannot call, `kernels` cannot time a comparison it cannot make, and `smoke` cannot run a query
# it cannot ask. Everything else in this crate reads files and shells out on purpose, because a task
# runner that fails to build is a task runner that cannot tell you why the build failed.
[dependencies]
rudb.workspace = true
rudb-common.workspace = true
rudb-compress.workspace = true
rudb-exec.workspace = true
rudb-io.workspace = true
rudb-kernels.workspace = true
rudb-parse.workspace = true
rudb-plan.workspace = true
rudb-vector.workspace = true

[lints]
workspace = true
