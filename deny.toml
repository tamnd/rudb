# cargo-deny configuration. Runs in CI on every commit, per spec/18-package-layout.md section 18.2.
# The dependency list is meant to stay short enough that a human can audit it, and this file is
# what stops it growing by accident.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# We ship under Apache-2.0 and only take dependencies whose terms that license can carry.
allow = [
  "Apache-2.0",
  # Cranelift, regalloc2 and target-lexicon, which the qc-clif feature builds. The exception only
  # widens what a user of the object code may do, so Apache-2.0 carries it.
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "Unicode-3.0",
  # rustls, aws-lc-rs and ring, which rudb-server uses for TLS and for SCRAM. aws-lc-rs carries
  # the OpenSSL license for its C part. Only rudb-server may depend on them, per
  # notes/Spec/2140/compat/postgres/16-crate-layout.md section 16.4. No engine crate does.
  # aws-lc-sys also carries BSD-3-Clause and MIT-0 for parts of its C code, and `subtle`, which
  # rustls uses for comparisons in constant time, is BSD-3-Clause.
  "BSD-3-Clause",
  "ISC",
  "MIT-0",
  "OpenSSL",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  # Two copies of a hasher in one process means two hash seeds, and a hash table that is built by
  # one and probed by the other is a wrong answer that only appears under a feature combination
  # nobody ran. Warn broadly above, deny for the crates where it would actually hurt.
  { name = "ahash" },
  # Cranelift keeps its own tables in hashbrown, through regalloc2 and through gimli's indexmap.
  # They hold the compiler's values while a function is lowered and never a row, so the copies
  # cannot build a table the database probes.
  { name = "hashbrown", wrappers = ["cranelift-codegen", "regalloc2", "indexmap"] },
  # spec/13-ecosystem.md: we read Parquet ourselves rather than shelling out to a reader whose
  # data structures we would then have to convert out of on the scan path.
  { name = "parquet2" },
  # TLS and the cryptography under it belong to rudb-server alone, per
  # notes/Spec/2140/compat/postgres/16-crate-layout.md section 16.4. An engine crate that wants a
  # hash uses its own, so the embedded build links no TLS code.
  { name = "rustls", wrappers = ["rudb-server"] },
  { name = "aws-lc-rs", wrappers = ["rudb-server", "rustls", "rustls-webpki"] },
  { name = "ring", wrappers = ["rudb-server", "rustls", "rustls-webpki"] },
]
skip = [
  # iana-time-zone uses syn 2 on Windows and syn 3 on WebAssembly. Both copies are build-time proc-macro dependencies and cannot exchange values in the database process.
  { name = "syn", version = "2" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
