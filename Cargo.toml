[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# The fuzz crate is its own workspace and stays out of this one. It needs nightly for the sanitizer
# and it pulls in libfuzzer, and neither of those belongs in the build that has to work on 1.88.0.
exclude = ["fuzz"]

[workspace.package]
version = "0.6.0"
edition = "2024"
# The floor was 1.85.0, which is only where edition 2024 starts, so it was never a support
# commitment anybody made on purpose. 1.88.0 is the oldest toolchain that has the two things the
# performance work needs. `#[target_feature(enable = ...)]` on a safe function landed in 1.86, and
# without it the AVX-512 and `VBMI2` dispatch that spec/07-execution.md section 7.3 still wants
# cannot be written in rudb-kernels at all, because that crate is `#![forbid(unsafe_code)]` and
# before 1.86 the attribute only went on an `unsafe fn`. `core::hint::select_unpredictable` landed
# in 1.88, and spec/perf/57 is the note about a branch mispredict that cost 6 percent of q01's
# cycles while retiring no extra instructions, which is exactly what that hint is for. Both checked
# by compiling them rather than read off a release note. Raising this is cheap next to the hardware
# floor in `.cargo/config.toml`, which asks for a CPU from 2013.
rust-version = "1.88.0"
license = "Apache-2.0"
repository = "https://github.com/tamnd/rudb"
homepage = "https://github.com/tamnd/rudb"
authors = ["tamnd <tamnd87@gmail.com>"]
keywords = ["database", "olap", "analytics", "sql", "duckdb"]
categories = ["database-implementations", "database"]
# Inherited paths resolve from the workspace root, so one line here gives every published crate a
# page on crates.io instead of a blank one.
readme = "README.md"

# One version number for the whole workspace, bumped together, per spec/18-package-layout.md
# section 18.3. Internal crates are pinned exactly so that a partial publish cannot produce a
# mixed-version build.
[workspace.dependencies]
# The code generator of the query compiler's second tier, and only behind the `qc-clif` feature,
# so the default build keeps the zero dependency rule. Pinned exactly because the IR it takes and the
# instructions it knows change between releases, and 0.125 is the last one that builds on our MSRV.
# The codegen crate without its defaults, which would build every target: `host-arch` is the one
# target the code runs on. cranelift-frontend asks for the default features back, so unwind and
# gimli come in regardless.
cranelift-codegen = { version = "=0.125.0", default-features = false, features = ["std", "host-arch"] }
cranelift-frontend = { version = "=0.125.0", default-features = false, features = ["std"] }
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
chrono-tz = "0.10.4"
iana-time-zone = "0.1.65"
# A disassembler for the tests of the `direct` backend's encoder, which decode what it wrote and compare
# the text. Only a dev-dependency, so nothing that ships links it.
iced-x86 = { version = "=1.21.0", default-features = false, features = ["std", "decoder", "intel"] }
libm = "0.2.16"
# The one outside crate that is not a library dependency. Only `rudb-cli` names it, only its binary
# uses it, and spec/18-package-layout.md section 18.5 says why that is allowed. The bindings rather
# than the `mimalloc` crate that wraps them, because the shell writes its own `GlobalAlloc` over
# them: see `crates/rudb-cli/src/heap.rs` for the one question it asks differently. Both features
# are load bearing and were picked by measurement, see `crates/rudb-cli/src/main.rs`: `v2` because
# the crate otherwise builds mimalloc 3, which on this workload is twice as slow as mimalloc 2 and
# holds 80 MB more, and `no_thp` because mimalloc asks the kernel for huge pages on its arenas and
# on a box with transparent huge pages set to madvise that turns a 0.44 second load into a 0.85
# second one.
libmimalloc-sys = { version = "0.1", default-features = false, features = ["v2", "no_thp"] }
memchr = "2.7.6"
rudb = { version = "=0.6.0", path = "crates/rudb" }
rudb-arrow = { version = "=0.6.0", path = "crates/rudb-arrow" }
rudb-bind = { version = "=0.6.0", path = "crates/rudb-bind" }
rudb-c-api = { version = "=0.6.0", path = "crates/rudb-c-api" }
rudb-catalog = { version = "=0.6.0", path = "crates/rudb-catalog" }
rudb-cli = { version = "=0.6.0", path = "crates/rudb-cli" }
rudb-common = { version = "=0.6.0", path = "crates/rudb-common" }
rudb-compress = { version = "=0.6.0", path = "crates/rudb-compress" }
rudb-csv = { version = "=0.6.0", path = "crates/rudb-csv" }
rudb-delta = { version = "=0.6.0", path = "crates/rudb-delta" }
rudb-duckdb-format = { version = "=0.6.0", path = "crates/rudb-duckdb-format" }
rudb-encoding = { version = "=0.6.0", path = "crates/rudb-encoding" }
rudb-exec = { version = "=0.6.0", path = "crates/rudb-exec" }
rudb-extension = { version = "=0.6.0", path = "crates/rudb-extension" }
rudb-functions = { version = "=0.6.0", path = "crates/rudb-functions" }
rudb-graph = { version = "=0.6.0", path = "crates/rudb-graph" }
rudb-iceberg = { version = "=0.6.0", path = "crates/rudb-iceberg" }
rudb-io = { version = "=0.6.0", path = "crates/rudb-io" }
rudb-json = { version = "=0.6.0", path = "crates/rudb-json" }
rudb-kernels = { version = "=0.6.0", path = "crates/rudb-kernels" }
rudb-metrics = { version = "=0.6.0", path = "crates/rudb-metrics" }
rudb-native = { version = "=0.6.0", path = "crates/rudb-native" }
rudb-opt = { version = "=0.6.0", path = "crates/rudb-opt" }
rudb-parquet = { version = "=0.6.0", path = "crates/rudb-parquet" }
rudb-parse = { version = "=0.6.0", path = "crates/rudb-parse" }
rudb-pipeline = { version = "=0.6.0", path = "crates/rudb-pipeline" }
rudb-plan = { version = "=0.6.0", path = "crates/rudb-plan" }
rudb-qc-ir = { version = "=0.6.0", path = "crates/rudb-qc-ir" }
rudb-qc-interp = { version = "=0.6.0", path = "crates/rudb-qc-interp" }
rudb-qc-clif = { version = "=0.6.0", path = "crates/rudb-qc-clif" }
rudb-qc-direct = { version = "=0.6.0", path = "crates/rudb-qc-direct" }
rudb-qc-rt = { version = "=0.6.0", path = "crates/rudb-qc-rt" }
rudb-qc-plan = { version = "=0.6.0", path = "crates/rudb-qc-plan" }
rudb-qc-pipe = { version = "=0.6.0", path = "crates/rudb-qc-pipe" }
rudb-qc-gen = { version = "=0.6.0", path = "crates/rudb-qc-gen" }
rudb-qc = { version = "=0.6.0", path = "crates/rudb-qc" }
rudb-regex = { version = "=0.6.0", path = "crates/rudb-regex" }
rudb-seam = { version = "=0.6.0", path = "crates/rudb-seam" }
rudb-stats = { version = "=0.6.0", path = "crates/rudb-stats" }
rudb-storage = { version = "=0.6.0", path = "crates/rudb-storage" }
rudb-txn = { version = "=0.6.0", path = "crates/rudb-txn" }
rudb-vector = { version = "=0.6.0", path = "crates/rudb-vector" }

[workspace.lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
# The buffer manager, the encoding kernels and the FFI boundary are where our unsafe lives, and
# spec/16-testing.md section 16.7 requires every block of it to carry the invariant that makes it
# sound. The lint is what turns that requirement into a build failure rather than a habit.
undocumented_unsafe_blocks = "warn"
doc_markdown = "allow"
missing_panics_doc = "warn"
todo = "warn"
# Rust 1.98 asks for `as_chunks` wherever `chunks_exact` has a constant size. The rewrite hands the
# loop `&[T; N]` rather than `&[T]`, and most of these loops are decode kernels that convert the
# chunk with `try_into` or index it, so the suggestion does not compile as written and moving each
# one is a kernel change that wants its own measurement rather than a lint pass.
chunks_exact_to_as_chunks = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
# No `panic = "abort"`. spec/04-architecture.md section 4.9 catches at the FFI boundary and
# converts to an error code, and that needs an unwinder.

# No size optimization for `rudb-cli` either. With LTO the link time passes run at the opt-level of
# the crate being linked, so `opt-level = "z"` on the CLI size-optimized the whole engine and not the
# CLI alone. It saved 0.8 MB of peak memory on a query that prints one row, and it made every
# TPC-H query slower: 6.9 percent more instructions over the suite and 25 percent more cycles on q01.

# A database is profiled far more often than it is shipped, so the release profile we actually
# develop against keeps frame pointers and debug info.
[profile.profiling]
inherits = "release"
debug = 1
strip = "none"

[profile.bench]
inherits = "profiling"

# Tests run with the plan verifier and the pin accounting on, which makes an unoptimized test
# binary painfully slow on anything at benchmark scale. Optimizing dependencies only keeps our own
# code debuggable while making the run bearable.
[profile.dev.package."*"]
opt-level = 2
