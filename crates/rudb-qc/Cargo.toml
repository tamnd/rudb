[package]
name = "rudb-qc"
description = "The compiled engine's driver: runs the generated pipelines over the first engine's scans and turns what they wrote into chunks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[dependencies]
rudb-common.workspace = true
rudb-catalog.workspace = true
rudb-plan.workspace = true
rudb-seam.workspace = true
rudb-pipeline.workspace = true
rudb-vector.workspace = true
rudb-kernels.workspace = true
rudb-exec.workspace = true
rudb-qc-ir.workspace = true
rudb-qc-interp.workspace = true
rudb-qc-rt.workspace = true
rudb-qc-plan.workspace = true
rudb-qc-pipe.workspace = true
rudb-qc-gen.workspace = true
rudb-qc-clif = { workspace = true, optional = true }

[target.'cfg(target_arch = "x86_64")'.dependencies]
rudb-qc-direct.workspace = true

[features]
default = []
# The second tier, `clif`: pipeline functions compiled to machine code through Cranelift. Off by
# default so that the default build keeps the zero dependency rule. CI builds with every feature
# and `cargo xtask` turns it on for the tasks that measure.
qc-clif = ["dep:rudb-qc-clif"]

[lints]
workspace = true
