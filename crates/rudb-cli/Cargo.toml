[package]
name = "rudb-cli"
description = "The command line shell."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[lib]
name = "rudb_cli"
path = "src/lib.rs"

[[bin]]
name = "rudb"
path = "src/main.rs"

# One dependency for the shell itself, which is the whole point of the crate. The shell is a program
# over the embedding API and nothing else, so anything it needs and cannot get from `rudb` is
# something a program somebody else writes could not get either.
#
# The allocator is the exception and it is not part of that argument. A global allocator is a
# property of the program rather than of the library, and this is the only program in the workspace
# that ships, so this is the only manifest that can name one. See `main.rs` for what it is worth and
# `spec/18-package-layout.md` section 18.5 for why it is allowed to be here and nowhere else.
[dependencies]
libmimalloc-sys = { workspace = true, optional = true }
rudb.workspace = true

[features]
default = []
# Off by default since the system allocator measured ahead on the queries, see `main.rs`. On gives
# the mimalloc build back for a workload that is mostly cross thread frees.
mimalloc = ["dep:libmimalloc-sys"]

[lints]
workspace = true
