[package]
name = "rudb-server"
description = "The PostgreSQL server: listeners, sessions and the binary rudb-server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[lib]
name = "rudb_server"
path = "src/lib.rs"

[[bin]]
name = "rudb-server"
path = "src/main.rs"

# `rustls` and `rustls-pki-types` are for TLS, with `aws-lc-rs` as the crypto provider by default
# and `ring` with the feature `tls-ring`, as document 05 section 5.6 of the PostgreSQL notes says.
# Only this crate may depend on them. The FIPS build of `aws-lc-rs` needs Go, and comes as its own
# feature later. The hashes of SCRAM come from the same provider, so a build has one SHA-256.
[features]
default = ["tls-aws-lc"]
tls-aws-lc = ["rustls/aws_lc_rs", "rustls/prefer-post-quantum", "dep:aws-lc-rs"]
tls-ring = ["rustls/ring", "dep:ring"]

# `libc` is for `poll(2)`, the socket options and the random bytes of the cancel keys, which the
# standard library does not have. Only this crate may depend on it, as document 16 section 16.4 of
# the PostgreSQL notes says.
[dependencies]
aws-lc-rs = { workspace = true, optional = true }
chrono.workspace = true
chrono-tz.workspace = true
libc.workspace = true
ring = { workspace = true, optional = true }
rudb.workspace = true
rudb-common.workspace = true
rudb-pgtypes.workspace = true
rudb-pgwire.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true

[lints]
workspace = true
