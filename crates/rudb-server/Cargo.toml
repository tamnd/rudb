[package]
name = "rudb-server"
description = "The PostgreSQL server: listeners, sessions and the binary rudb-server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[lib]
name = "rudb_server"
path = "src/lib.rs"

[[bin]]
name = "rudb-server"
path = "src/main.rs"

# `libc` is for `poll(2)`, the socket options and the random bytes of the cancel keys, which the
# standard library does not have. Only this crate may depend on it, as document 16 section 16.4 of
# the PostgreSQL notes says.
[dependencies]
chrono.workspace = true
chrono-tz.workspace = true
libc.workspace = true
rudb.workspace = true
rudb-common.workspace = true
rudb-pgtypes.workspace = true
rudb-pgwire.workspace = true

[lints]
workspace = true
