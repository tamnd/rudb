name: Performance
description: A query, a load or a file is slower or larger than it should be.
title: "perf: "
labels: ["kind/perf", "area/perf"]
body:
  - type: markdown
    attributes:
      value: |
        The reporting rules in `spec/15-rudb-bench.md` section 15.1 apply to bug reports as well as to anything we publish. In short: state the comparison exactly, report the median of at least five runs with the interquartile range rather than the best one, report cold and hot separately, and describe the machine. A number without a machine attached cannot be acted on.

        Four different things get called database performance and this project keeps them apart, because they trade against each other. Please say which one this is.
  - type: dropdown
    id: which
    attributes:
      label: Which one
      options:
        - Hot query time
        - Cold query time, meaning the first run against a cold page cache
        - Load or ingest time
        - On-disk size
        - Peak resident memory
    validations:
      required: true
  - type: textarea
    id: numbers
    attributes:
      label: The numbers
      description: What was measured, against what, on what. Include the exact command. If you are comparing against DuckDB or ClickHouse, give their versions too.
      render: shell
    validations:
      required: true
  - type: textarea
    id: workload
    attributes:
      label: The workload
      description: The schema, the query, and where the data comes from. A workload nobody else can run is a workload nobody else can fix. A public dataset or a generator is far better than a description.
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: The plan
      description: The output of `EXPLAIN ANALYZE`. This is usually enough on its own to say whether the problem is the optimizer, an operator or the scan.
      render: text
  - type: input
    id: machine
    attributes:
      label: The machine
      description: CPU, core count, memory, operating system, filesystem, and whether it is a virtual machine. Never compare across machines.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `rudb --version`, or the commit.
    validations:
      required: true
