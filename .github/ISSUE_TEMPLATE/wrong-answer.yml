name: Wrong answer
description: A query returned a result that is not the right result.
title: "wrong answer: "
labels: ["kind/bug", "priority/p0"]
body:
  - type: markdown
    attributes:
      value: |
        This is the most valuable kind of bug report the project can get. `spec/16-testing.md` section 16.9 says a released version has no known wrong-answer bug, and every one of these is a hole in that claim. A database that is fast and wrong is worth nothing, and the whole point of the encoded execution paths in `spec/06-compression.md` section 6.7 is that they have to agree with the decoded paths exactly.

        A small reproduction is enormously more useful than a large one. If you can get it down to a `CREATE TABLE`, a few `INSERT`s and one `SELECT`, please do. If you cannot, file it anyway and we will reduce it.
  - type: textarea
    id: repro
    attributes:
      label: The reproduction
      description: The full SQL, including the schema and the data. Paste it here rather than linking it, so the issue stays readable after the link rots.
      render: sql
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What it should return, and what it returns
      description: If DuckDB and PostgreSQL agree with each other and disagree with us, say so. That settles which engine is wrong before anyone opens a debugger.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Which mode
      description: Native format, an attached DuckDB file and Parquet in place are three different read paths, per spec/12-duckdb-compat.md section 12.1.
      options:
        - Native rudb format
        - Attached DuckDB file
        - Parquet in place
        - In memory, no file
        - Something else, described below
    validations:
      required: true
  - type: textarea
    id: narrowing
    attributes:
      label: What narrows it
      description: Anything you already tried. Whether it survives `SET threads = 1`, whether it survives `PRAGMA disable_optimizer`, whether a smaller table still shows it. Each of those cuts the search in half.
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `rudb --version`, or the commit.
    validations:
      required: true
  - type: input
    id: machine
    attributes:
      label: The machine
      description: CPU, core count, memory, operating system.
    validations:
      required: true
