# Tagged releases: build the shell on every host we claim to support, attest it, publish the
# archives to GitHub and publish the source to crates.io.
#
# An embedded database is something other people link into their own program, so the hosts it
# builds on are part of what it is. The matrix here is the same three hosts CI runs on plus the
# two extra targets people actually deploy on, and a host that fails to build blocks the release
# rather than being dropped from it.
#
# A version on crates.io cannot be taken back, only yanked, so nothing is uploaded until the tag
# has passed the gate. It does not wait for the binary matrix. What goes to the registry is source
# that `cargo publish` compiles and verifies for itself on a Linux runner, so a cross build for a
# host nobody is installing from cargo on cannot make that upload any more correct. It can and did
# make it never happen: the 0.0.2 tag had both macOS jobs sit unassigned in GitHub's hosted queue
# for half an hour with every other job green, and the registry has no reason to be downstream of
# that.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: the tag to build, for a dry run
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # A tag that does not pass the gate does not become a release. Cheaper to find out here than
  # after the artifacts are uploaded.
  verify:
    name: verify the tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: the version in the tag matches the workspace
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          want="${tag#v}"
          have=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$want" != "$have" ]; then
            echo "tag $tag says $want but Cargo.toml says $have"
            exit 1
          fi
          echo "releasing $have"
      - name: the changelog has an entry
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          grep -q "## ${tag#v}" CHANGELOG.md || {
            echo "CHANGELOG.md has no section for ${tag#v}"
            exit 1
          }
      # Asked here rather than three jobs later, because this is how both of the first two releases
      # failed. On 0.0.1 the secret was never set, the binaries built and were attested and were
      # shipped, and the last job died on "please provide a non-empty token" with a GitHub release
      # already published and nothing on crates.io. So a check went in and it asked only whether the
      # string was empty. On 0.0.2 the string was not empty and crates.io answered 401 saying the
      # token did not match the format it uses, because every token issued before 2020-07-14 was
      # revoked after the RNG advisory and the one on the repository was older than that.
      #
      # There is no endpoint to ask instead. crates.io accepts an API token on publish, yank and
      # owner changes, and on nothing that is safe to run for a check. `/api/v1/me` looks like the
      # answer and is not: it is session only and replies 403 to a live token and a dead one alike,
      # which is a check that fails every release forever. So this checks the shape, which is what
      # the 401 was complaining about anyway, and it stays out of the business of guessing whether a
      # well formed token is live. Only publishing knows that. Nothing is printed but the verdict.
      - name: the crates.io token is shaped like a token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CARGO_REGISTRY_TOKEN is not set on this repository"
            echo "set it at https://github.com/tamnd/rudb/settings/secrets/actions"
            exit 1
          fi
          # Current tokens are `cio` and 32 characters. Ones issued between the 2020 advisory and
          # the prefix are the same 32 without it and are still accepted, so both pass. Anything
          # else is a token from before the advisory, or a value that picked up a quote or a newline
          # on the way into the secret, and both of those are worth catching now rather than after
          # the binaries are attested and published.
          if ! printf '%s' "$CARGO_REGISTRY_TOKEN" | grep -Eq '^(cio)?[A-Za-z0-9]{32}$'; then
            echo "CARGO_REGISTRY_TOKEN is not shaped like a crates.io token"
            echo "it should be cio followed by 32 characters, with no quotes and no newline"
            echo "generate a new one at https://crates.io/me and set it at"
            echo "https://github.com/tamnd/rudb/settings/secrets/actions"
            exit 1
          fi
          echo "the token is well formed"
      - run: cargo xtask ci
      # The storage format version a release writes is part of what the release is. It goes into
      # the run log so that a file found in the wild years from now can be traced back to the
      # release that wrote it.
      - name: record what this release writes
        run: cargo run -q --release --bin rudb -- --print-config

  build:
    name: build for ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-26
          - target: x86_64-apple-darwin
            os: macos-26
          - target: x86_64-pc-windows-msvc
            os: windows-2025
    steps:
      - uses: actions/checkout@v7.0.1
      - name: add the target
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: build
        run: cargo build --release --bin rudb --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          name="rudb-${{ github.event.inputs.tag || github.ref_name }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/rudb.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/rudb" "dist/$name/"
          fi
          cp README.md LICENSE-APACHE CHANGELOG.md "dist/$name/"
          cd dist
          # Both formats, because the people who want a .zip and the people who want a .tar.gz do
          # not overlap and neither group should have to install a tool.
          tar --format=ustar -czf "$name.tar.gz" "$name"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            zip -qr "$name.zip" "$name"
          fi
          for f in "$name.tar.gz" "$name.zip"; do
            if command -v sha256sum > /dev/null; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Provenance attestation, so that someone downloading a binary can check which workflow run
      # and which commit produced it.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: list what is being published
        run: ls -l dist
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      # The release notes are the changelog section, written by hand, rather than a list of commit
      # subjects. GitHub's generated list of merged pull requests is appended after it for anyone
      # who wants the detail.
      - name: take the release notes from the changelog
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          awk -v want="## ${tag#v}" '
            $0 == want { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $tag"; exit 1; }
          cat notes.md
      - uses: softprops/action-gh-release@v3.0.3
        with:
          files: dist/*
          body_path: notes.md
          generate_release_notes: true
          # Not marked as a pre-release. Every one of these is a finished release of the code that
          # exists at the tag, and what pre-1.0 means for compatibility is said in CHANGELOG.md and
          # in spec/18-package-layout.md rather than by a label that also keeps the release off the
          # repository front page and out of what `gh release view` answers with.
          fail_on_unmatched_files: true

  # Every crate in the workspace goes to crates.io, in dependency order, which cargo works out for
  # itself from the workspace graph. They are versioned and released together per
  # spec/18-package-layout.md, so a partial upload is a bug rather than a supported state, and
  # `--locked` means the published tree resolves to exactly what CI tested rather than to whatever
  # was newest that morning. The script is what makes a partial upload recoverable rather than
  # permanent: it excludes what the index already has and waits out the registry's rate limit, so
  # re-running this job finishes the release.
  #
  # This does not run for a workflow_dispatch dry run. A dry run is for checking that the binaries
  # build, and an upload to crates.io cannot be undone.
  #
  # The timeout is five and a half hours because the first release is 27 crates that crates.io has
  # never seen, and a new crate is limited to one every ten minutes after a burst of five. That is
  # about three and a half hours of a job doing nothing but sleeping, once, and a couple of minutes
  # on every release after it. If it does run out, nothing is lost: the script asks the index what
  # is already up and re-running the job carries on from there.
  crates-io:
    name: publish to crates.io
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      contents: read
    steps:
      # No cache step here on purpose. This job compiles the workspace once, during the
      # verification `cargo publish` does of each crate, and never reads it again, so a cache saves
      # nothing and its post step walks a `target/package` tree that cargo is deleting underneath
      # it and reports the races as errors on the release run, which is the worst run to have
      # meaningless red marks on.
      - uses: actions/checkout@v7.0.1
      - name: publish the workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: .github/publish-crates.sh
