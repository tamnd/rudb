# The nightly tier from spec/16-testing.md section 16.7.
#
# Everything here is too slow or too noisy to gate a merge, and all of it is the kind of check
# that finds a problem days before a user would. At M0 the list is short, because most of what
# belongs here needs a database that answers queries. It grows with the milestones, and the
# placeholders are named rather than left implicit so that the gap is visible.

name: nightly

on:
  schedule:
    # 03:00 UTC. Late enough that a day's commits are all in, early enough that the results are
    # waiting in the morning.
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  sanitizers:
    name: ${{ matrix.san }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        san: [address, thread]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: install nightly
        run: rustup toolchain install nightly --profile minimal --component rust-src
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: san-${{ matrix.san }}
      # The unsafe in this workspace is in four crates and it is all of the kind sanitizers find:
      # the buffer manager hands out pointers into mapped pages, the vector layer indexes without
      # bounds checks where the validity mask has already been consulted, the kernels use
      # `core::arch` intrinsics on unaligned loads, and the C API takes pointers from a caller.
      # The thread sanitizer is there for the second half of that list, because the buffer manager
      # and the parallel operators share those pages across threads.
      - name: cargo test under -Zsanitizer=${{ matrix.san }}
        env:
          RUSTFLAGS: -Zsanitizer=${{ matrix.san }}
          RUSTDOCFLAGS: -Zsanitizer=${{ matrix.san }}
        run: |
          cargo +nightly test --workspace --all-features \
            -Zbuild-std --target x86_64-unknown-linux-gnu

  miri:
    name: miri
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: install nightly with miri
        run: rustup toolchain install nightly --profile minimal --component miri
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: miri
      # Unit tests only. The integration tests open database files and spawn the shell, and Miri
      # can do neither, so under it they fail on the first `open` rather than checking anything.
      # The unsafe this job exists for is in the libraries anyway.
      #
      # Miri is slow enough that it will stop being able to run even this at some point. When that
      # happens the answer is to select the crates whose unsafe justifies it, not to drop the job.
      - run: cargo +nightly miri test --workspace --lib
        env:
          MIRIFLAGS: -Zmiri-strict-provenance

  advisories:
    name: advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: taiki-e/install-action@v2.87.9
        with:
          tool: cargo-deny
      # The per-commit job checks the advisory database as it stood when the commit landed. This
      # one catches an advisory published after the fact, which is the case that matters for a
      # dependency we have already shipped.
      - run: cargo deny --all-features check advisories bans

  # The full test suite on every host, in release, which is where a difference between the three
  # shows up. The per-commit matrix runs release on Linux only, because it doubles the time.
  release-everywhere:
    name: release build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26, windows-2025]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: nightly-release
      - run: cargo test --workspace --all-features --release

  # Named so the gap is visible rather than implicit. Each of these turns into a real job at the
  # milestone that makes it possible, per spec/16-testing.md section 16.7.
  planned:
    name: what belongs here and does not exist yet
    runs-on: ubuntu-24.04
    steps:
      - name: the list
        run: |
          cat <<'EOF'
          the full ClickBench run, cold and hot, against the recorded baselines    M2
          the sqllogictest corpus from DuckDB, run through tamnd/rudb-compat      M2
          the encoded-execution equivalence sweep, encoded against decoded        M3
          TPC-H, TPC-DS, JOB and CEB at scale factor 100                          M4
          randomized differential query generation against a real DuckDB          M5
          the crash simulator over the enumerated failure points                  M6
          the storage format round trip, write with us and read with DuckDB       M7
          the C API conformance suite generated from DuckDB's ABI YAML            M7
          tier equivalence, interpreted against fused against compiled            M8
          EOF
