# The per-commit gate. Everything here is required to merge.
#
# The matrix is the first rows of the table in spec/16-testing.md section 16.7. The differential
# against a real DuckDB arrives with the harness in tamnd/rudb-compat, at M2, and it is not listed
# here yet, because a job that is red because the thing it calls does not exist teaches everyone to
# ignore a red run.
#
# The bench job below is not a benchmark. A timing taken on a shared runner is not a timing and the
# numbers it prints are thrown away. What it checks is that the apparatus still produces a table,
# which is a different question from what the table says and is the one that decides whether this
# still works in six months.
#
# Actions are pinned to a patch version rather than a major tag. A major tag is a moving reference,
# and a database that cannot reproduce its own CI run has given up something it needs.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# A force-push should cancel the run it replaced. The default branch is exempt, because a
# main-branch run is what the badge and the bisect history read from.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  # Cheapest checks first, so a formatting mistake costs seconds rather than a full matrix.
  quick:
    name: format, lints and house rules
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: cargo fmt
        run: cargo fmt --all --check
      # spec/04-architecture.md section 4.2 gives every crate a rank and lets it depend only on
      # crates of strictly lower rank. A cycle between the optimizer and the catalog is the kind of
      # thing that is free to prevent on day one and a month of work to undo later.
      - name: layer rule
        run: cargo xtask layers
      - name: prose style
        run: cargo xtask style
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features

  test:
    name: test on ${{ matrix.name }}
    needs: quick
    runs-on: ${{ matrix.os }}
    # Runner images are named explicitly rather than through `-latest`, so that an image rollout
    # shows up as a commit rather than as yesterday's green run turning red. The policy is the
    # newest generally available image per host: Ubuntu 26.04 exists but is still marked preview,
    # so Linux stays on 24.04 until it is not.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux x86-64, debug
            os: ubuntu-24.04
            profile: dev
          - name: linux x86-64, release
            os: ubuntu-24.04
            profile: release
          - name: macos arm64
            os: macos-26
            profile: dev
          - name: windows x86-64
            os: windows-2025
            profile: dev
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.profile }}
      - name: cargo build
        run: cargo build --workspace --all-features --profile ${{ matrix.profile }}
      - name: cargo test
        run: cargo test --workspace --all-features --profile ${{ matrix.profile }}
      # The M0 exit criterion in spec/17-milestones.md is that the binary builds and runs on all
      # three hosts, so it is checked rather than assumed. It is also the first place a difference
      # between the three would show up, and the storage format has to be identical on all of them.
      - name: rudb --print-config
        shell: bash
        run: |
          set -euo pipefail
          dir=${{ matrix.profile == 'dev' && 'debug' || 'release' }}
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          "./target/$dir/rudb$exe" --version
          "./target/$dir/rudb$exe" --print-config

  docs:
    name: documentation
    needs: quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      # Every crate is published, so every crate's documentation has to build. A broken intra-doc
      # link is a broken link on docs.rs.
      - name: cargo doc
        run: cargo doc --workspace --all-features --no-deps

  msrv:
    name: minimum supported rust version
    needs: quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: read the floor from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          v=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: install
        run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: msrv
      # An embedded database that needs last week's stable Rust is a database people cannot embed,
      # per spec/18-package-layout.md. The floor is raised deliberately, in a commit, not by
      # accident in a dependency bump.
      - name: cargo check
        run: cargo +${{ steps.msrv.outputs.version }} check --workspace --all-features

  determinism:
    name: reproducible output
    needs: quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      # spec/05-storage-format.md requires that writing the same data twice produces the same
      # bytes, because a format whose output depends on hash iteration order cannot be compared,
      # cached or verified. There is no writer yet, so this checks the property one level down,
      # on the binary itself, which catches the same class of mistake while it is still cheap.
      - name: build twice and compare
        run: |
          set -euo pipefail
          cargo build --release --bin rudb
          sha256sum target/release/rudb > first.sha256
          rm -rf target/release/rudb target/release/.fingerprint
          cargo build --release --bin rudb
          sha256sum target/release/rudb > second.sha256
          diff <(cut -d' ' -f1 first.sha256) <(cut -d' ' -f1 second.sha256)
          echo "the binary builds reproducibly"

  bench:
    name: the front end table still prints
    needs: quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: bench
      # The task rebuilds itself under the bench profile before it measures anything, so this also
      # covers the one code path a unit test cannot reach, which is the re-exec. Read nothing into
      # the numbers: this is two vCPUs shared with whoever else is on the host.
      - name: cargo xtask bench
        run: cargo xtask bench

  audit:
    name: supply chain
    needs: quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: taiki-e/install-action@v2.87.9
        with:
          tool: cargo-deny
      # Licenses, advisories, banned crates and unknown registries, all configured in deny.toml
      # and justified in spec/18-package-layout.md.
      - name: cargo deny
        run: cargo deny --all-features check
      # The count is of crates and not of lines, which is why the trailing marker cargo puts on a
      # subtree it has already printed is cut off first. Without that a crate two others both
      # depend on is counted twice and the number drifts upwards on its own.
      - name: report the dependency count
        run: |
          set -euo pipefail
          count() {
            cargo tree "$@" --edges normal --prefix none --all-features \
              | sed 's/ (\*)$//' | sort -u | grep -c . || true
          }
          echo "the database: $(count -p rudb) crates including transitives"
          echo "the workspace: $(count --workspace) crates, which adds the test and build tooling"
          echo "The budget in spec/18-package-layout.md is under forty for the database itself."

  # A single required check, so branch protection does not have to list every job above.
  ci:
    name: ci
    if: always()
    needs: [quick, test, docs, msrv, determinism, bench, audit]
    runs-on: ubuntu-24.04
    steps:
      - name: fail if anything upstream failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: pass
        run: echo "all required jobs succeeded"
